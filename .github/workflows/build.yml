name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0 - make it higher every time)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle (retries if the server is busy)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            echo "Download failed, trying again in 20s ($i)"; sleep 20
          done
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Prepare signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          for i in 1 2 3; do gradle assembleRelease --no-daemon && break; echo "Build failed, trying again ($i)"; sleep 20; [ $i = 3 ] && exit 1; done
          cp app/build/outputs/apk/release/app-release.apk ../GreenbackTerminal.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: GreenbackTerminal.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build small Windows app (Edge WebView2)
        shell: pwsh
        working-directory: windows-lite
        run: |
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force payload | Out-Null
          dotnet build -c Release -p:Version=$v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bin = "bin"
          foreach ($n in @("Microsoft.Web.WebView2.Core.dll","Microsoft.Web.WebView2.WinForms.dll")) { Get-ChildItem $bin -Recurse -Filter $n | Select-Object -First 1 | Copy-Item -Destination payload -Force }
          $loader = Get-ChildItem $bin -Recurse -Filter WebView2Loader.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $loader) { $loader = Get-ChildItem $env:USERPROFILE\.nuget\packages\microsoft.web.webview2 -Recurse -Filter WebView2Loader.dll | Where-Object { $_.FullName -match "win-x64" } | Select-Object -First 1 }
          Copy-Item $loader.FullName payload -Force
          Get-ChildItem payload
          if ((Get-ChildItem payload).Count -lt 3) { Write-Error "WebView2 files missing"; exit 1 }
          dotnet build -c Release -p:Version=$v --no-incremental
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem $bin -Recurse -Filter GreenbackTerminal.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $exe.FullName ..\out\GreenbackTerminal-Setup.exe
          Get-Item ..\out\GreenbackTerminal-Setup.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/GreenbackTerminal-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Greenback Terminal ${{ inputs.version }}
          make_latest: true
          body: |
            Greenback Terminal ${{ inputs.version }}
            - Android: GreenbackTerminal.apk
            - Windows: GreenbackTerminal-Setup.exe
            Download from https://greenbackterminal.com/app
          files: out/*
