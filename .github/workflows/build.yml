name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0 - make it higher every time)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle (retries if the server is busy)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            echo "Download failed, trying again in 20s ($i)"; sleep 20
          done
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Prepare signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          for i in 1 2 3; do gradle assembleRelease --no-daemon && break; echo "Build failed, trying again ($i)"; sleep 20; [ $i = 3 ] && exit 1; done
          cp app/build/outputs/apk/release/app-release.apk ../GreenbackTerminal.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: GreenbackTerminal.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Remember downloaded build tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-tools-v1
      - name: Prepare Windows build tools (retries if GitHub is busy)
        shell: bash
        run: |
          DIR="$(cygpath -u "$LOCALAPPDATA")/electron-builder/Cache/winCodeSign/winCodeSign-2.6.0"
          if [ -f "$DIR/windows-10/x64/signtool.exe" ]; then echo "Already prepared"; exit 0; fi
          mkdir -p "$DIR"
          for i in 1 2 3 4 5 6 7 8; do
            for URL in https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z https://npmmirror.com/mirrors/electron-builder-binaries/winCodeSign-2.6.0/winCodeSign-2.6.0.7z; do
              curl -fSL --retry 3 --retry-all-errors --retry-delay 5 -m 300 -o wcs.7z "$URL" && 7z x wcs.7z "-o$(cygpath -w "$DIR")" -y "-xr!darwin" && exit 0
              echo "Download failed from $URL"
            done
            echo "Trying again in 30s ($i)"; sleep 30
          done
          echo "Could not prepare tools - the build step will try another way"
      - name: Build installer
        working-directory: windows
        shell: bash
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          for i in 1 2 3 4 5; do npm ci --no-audit --no-fund && break; echo "npm failed, trying again ($i)"; sleep 30; [ $i = 5 ] && exit 1; done
          for i in 1 2 3 4; do npx electron-builder --win nsis --publish never && exit 0; echo "Build failed, trying again in 30s ($i)"; sleep 30; done
          echo "Trying the download mirror"
          export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
          npx electron-builder --win nsis --publish never && exit 0
          echo "Last try: build without editing the program file"
          npx electron-builder --win nsis --publish never -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: windows/dist/GreenbackTerminal-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Greenback Terminal ${{ inputs.version }}
          make_latest: true
          body: |
            Greenback Terminal ${{ inputs.version }}
            - Android: GreenbackTerminal.apk
            - Windows: GreenbackTerminal-Setup.exe
            Download from https://greenbackterminal.com/app
          files: out/*
