plugins { id 'com.android.application' }

def appVersion = System.getenv('VERSION_NAME') ?: '2.0.1'

android {
    namespace 'com.greenbackterminal.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greenbackterminal.app'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '100') as int)
        versionName appVersion
        // The app's screens come from the website (greenbackterminal.com/m), so every website update reaches the app at once.
        buildConfigField 'String', 'START_URL', '"https://greenbackterminal.com/m"'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'greenback'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

// No libraries: the app uses only Android's own components, which keeps it small and fast.
dependencies { }
