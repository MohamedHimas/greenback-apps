plugins { id 'com.android.application' }

def appVersion = System.getenv('VERSION_NAME') ?: '1.1.0'

android {
    namespace 'com.greenbackterminal.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greenbackterminal.app'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName appVersion
        // The app opens the live website inside the phone's own Chrome engine (Trusted Web Activity).
        manifestPlaceholders = [startUrl: "https://greenbackterminal.com/?gbapp=android&gbv=" + appVersion]
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'greenback'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
